name: 'final_project'
version: '1.0.0'
profile: 'final_project'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Parent landing path (no source folder). Staging models append their source
# name, e.g. {{ var("landing_path") }}/postings, so a second source is another
# staging model on the same parent rather than a new LANDING_PATH. Set
# LANDING_PATH in data/.env (and on the VM via pipeline_settings.yaml).
#
# Shape: /Volumes/<catalog>/landing/<volume>/<prefix-or-empty>
# Examples: .../landing/dev/your-name  |  .../landing/dev/aca-dev  |  .../landing/prod
# (prod volume is rooted at the container's raw/ blob prefix, so there is no
# extra "raw" segment in the Volume path.)
#
# tech_roles: one shared list of (title substring -> clean tag) pairs, used by
# int_postings_categories.sql to tag postings by role. Defined once here
# instead of duplicated in Python and SQL separately -- add a role by adding
# one line below, not by remembering to update two files.
vars:
  landing_path: "{{ env_var('LANDING_PATH', '/Volumes/team_b/landing/prod') }}"

  tech_roles:
    - {match: "data engineer", tag: "Data Engineer"}
    - {match: "data analyst", tag: "Data Analyst"}
    - {match: "data scientist", tag: "Data Scientist"}
    - {match: "machine learning", tag: "Machine Learning Engineer"}
    - {match: "analytics engineer", tag: "Analytics Engineer"}
    - {match: "ai engineer", tag: "AI Engineer"}
    - {match: "business intelligence", tag: "BI Developer"}
    - {match: "software engineer", tag: "Software Engineer"}
    - {match: "backend", tag: "Backend Developer"}
    - {match: "frontend", tag: "Frontend Developer"}
    - {match: "full stack", tag: "Full Stack Developer"}
    - {match: "fullstack", tag: "Full Stack Developer"}
    - {match: "python developer", tag: "Python Developer"}
    - {match: "java developer", tag: "Java Developer"}
    - {match: "mobile app developer", tag: "Mobile App Developer"}
    - {match: "devops engineer", tag: "DevOps Engineer"}
    - {match: "cloud architect", tag: "Cloud Architect"}
    - {match: "cloud engineer", tag: "Cloud Engineer"}
    - {match: "site reliability", tag: "Site Reliability Engineer"}
    - {match: "platform engineer", tag: "Platform Engineer"}
    - {match: "systems administrator", tag: "Systems Administrator"}
    - {match: "cyber security", tag: "Cyber Security Engineer"}
    - {match: "security analyst", tag: "Security Analyst"}
    - {match: "network engineer", tag: "Network Engineer"}
    - {match: "test automation", tag: "Test Automation Engineer"}
    - {match: "qa engineer", tag: "QA Engineer"}
    - {match: "scrum master", tag: "Scrum Master"}
    - {match: "product owner", tag: "Product Owner"}
    - {match: "solution architect", tag: "Solution Architect"}

clean-targets:
  - "target"
  - "dbt_packages"

models:
  final_project:
    staging:
      +materialized: view
    # Views, so they cost nothing to store and you can query them while you are
    # working out why a mart looks wrong. `ephemeral` is the other common
    # choice: it pastes the SQL into whatever selects it, which is tidier in the
    # warehouse but leaves you nothing to inspect when a number is off. While
    # you are learning, being able to select from it is worth more.
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Optional, and off. It calls an LLM, so it needs an API key in a secret
      # scope before it can run at all, and a `dbt build` that fails for a team
      # who never asked for it would be worse than useless. Set `enabled: true`
      # and your own `secret_scope` when your team wants it. Disabled models are
      # parsed and then ignored: it costs nothing to leave this here.
      # See ../optional/README.md.
      fct_title_discipline:
        +enabled: false
        +secret_scope: team_b

