version: 2

models:
  - name: int_postings_title
    description: >
      Cleaned version of stg_postings. Strips job title noise (parentheticals,
      pipe-separated details, bullet-separated location/specialty tails, "via
      Zorgwerk in ..." segments, trailing dash + place names, and sentence-style
      trailing descriptions) and normalizes company_name by removing trailing
      legal suffixes (NL, B.V., N.V.) and collapsing whitespace.
      NOTE: title cleaning still needs further work (see leading comment in
      the model SQL) — some multi-word place names and edge cases are not
      yet handled.
    columns:
      - name: title
        description: >
          Cleaned job title with trailing location/description noise removed
          and whitespace normalized. Null/empty titles are filtered out by
          the model's WHERE clause.
        tests:
          - not_null

      - name: company_name
        description: >
          Cleaned company name with trailing legal-entity suffixes
          (NL, B.V., N.V.) stripped and whitespace normalized. Can be null
          if the source company_name was null or became empty after cleaning.