version: 2
#skills
models:
  - name: int_postings_skills
    description: >
      One row per distinct skill mentioned in a job posting, exploded from the
      `skills` JSON array column on stg_postings. Skill names are 
      lowercased and trimmed, and blank/null values are dropped.
    columns:
      - name: job_id
        description: Foreign key to the job posting this skill belongs to.
        tests:
          - not_null
          - relationships:
              to: ref('stg_postings')
              field: job_id

      - name: skill_name
        description: A single skill extracted from the posting, lowercased and trimmed.