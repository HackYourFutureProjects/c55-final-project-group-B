version: 2

# Column groups, top to bottom:
#   Core         : job_id, title, company_name, description
#   Location     : location_city, location_province, latitude, longitude
#   Dates & URLs : created, redirect_url
#   Category     : category_label, is_category_known, category_tag
#   Title-derived: contract_type_from_title, employment_type   (from int_postings_title_company)
#   Salary       : salary_min, salary_max, salary_display, salary_note
#   LLM enrichment: contract_type_from_desc, seniority_level, posting_language,
#                   required_language, salary_per_hour, weekly_hours, skills, tasks
#   Audit        : ingested_at

models:
  - name: fct_postings
    description: >
      One row per posting. This is the published contract consumed by the
      backend API. Adding a column is safe; renaming or removing one breaks
      the backend and must be agreed with them first.
    columns:
      - name: job_id
        description: Stable unique identifier. Use this as the API resource id.
        tests: [unique, not_null]
      - name: title
        description: Job title as advertised.
        tests: [not_null]
      - name: company_name
        description: "(string) Hiring company name."
      - name: description
        description: "(string) Full job description text from the source."
      - name: location_city
        description: "(string) Primary city string." #here we still need to split the city and province from the location string, but we can do that in a later step.
        tests: [not_null]
      - name: location_province
        description: "(string) Province/region string for the job location."
      - name: latitude
        description: "(float / double) Latitude of the job location, if available."
      - name: longitude
        description: "(float / double) Longitude of the job location, if available."
      - name: created
        description: "(timestamp) Timestamp the posting was created at the source."
        tests: [not_null]
      - name: redirect_url
        description: "(string / text) URL to the original posting on the source website."
        tests: [not_null]
      - name: category_label
        description: >
          (string) The category label from the source. This is a string, not a stable
          identifier. Use it for display purposes only, and it's written in dutch for example: "Administratieve".
      - name: category_tag
        description: >
          (string) The category tag from the source. This is a string, not a stable
          identifier. Use it for display purposes only, and it's written in english for example: "admin-jobs".
      - name: is_category_known
        description: >
          (boolean) Whether the category is known or not. This is a boolean, not a stable
          identifier. Use it for display purposes only.
      #- name: contract_type_from_title
        #description: >
          #(string) Contract type extracted from the raw title before cleaning,
          #based on Dutch/English keyword matches (e.g. "parttime", "voltijd").
          #One of 'part_time', 'full_time', or null if no keyword was found in
          #the title. Display-only — map to a translated label on the
          #frontend rather than storing separate language columns here.
        #tests:
         # - accepted_values:
          #    values: ['part_time', 'full_time']
           #   config:
            #    where: "contract_type_from_title is not null"
      - name: employment_type
        description: >
          (string) Employment type extracted from the raw title before
          cleaning, based on Dutch/English keyword matches (e.g. "stage",
          "internship", "traineeship"). One of 'graduation_internship',
          'internship', or 'regular_job' (default when no keyword matches).
          Display-only — map to a translated label on the frontend rather
          than storing separate language columns here.
        tests:
          - accepted_values:
              values: ['graduation_internship', 'internship', 'regular_job']
      - name: salary_min
        description: >
          (float / double) The minimum salary from the source. This is a float, not a stable
          identifier. Use it for display purposes only.
      - name: salary_max
        description: >
          (float / double) The maximum salary from the source. This is a float, not a stable
          identifier. Use it for display purposes only.
      - name: salary_display
        description: >
          (string) The salary display string from the source. This is a string, not a stable
          identifier. Use it for display purposes only.
      - name: salary_note
        description: >
          (string) Notes on salary reliability/source, e.g. whether it was stated by the
          employer or estimated.
      #- name: contract_type_from_desc
      #  description: >
       #   (string) Contract type (full_time / part_time / unknown) inferred by the LLM
        #  from the job description text. Use it for display/filtering purposes only,
         # it is not a stable identifier.
      - name: seniority_level
        description: >
          (string) Seniority level (junior / mid / senior / unknown) inferred by the
          LLM from the job description text.
      - name: posting_language
        description: >
          (string) The language the job posting itself is written in, as detected by
          the LLM, e.g. "Dutch", "English".
      - name: required_language
        description: >
          (string) The language explicitly required of applicants according to the
          posting, as detected by the LLM: "Dutch", "English", "Both", or "Not Specified".
      - name: salary_per_hour
        description: >
          (float / double) Hourly salary figure extracted by the LLM from the job
          description, if one was stated. Null when no hourly figure could be parsed.
      - name: weekly_hours
        description: >
          (string) Weekly working hours as stated or inferred by the LLM from the job
          description. Use it for display purposes only.
      - name: skills
        description: >
          (array<string>) Technical, domain, or professional skills extracted by the
          LLM from the job description. Empty array when none were found.
      - name: tasks
        description: >
          (array<string>) Core tasks, duties, or physical responsibilities extracted
          by the LLM from the job description. Empty array when none were found.
      - name: ingested_at
        description: "(timestamp) When your pipeline last saw this record. Use it to show data freshness in the UI."
        tests: [not_null]

        